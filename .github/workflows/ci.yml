name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: xcode-27

    env:
      XCODEGEN_VERSION: "2.45.3"
      SWIFTFORMAT_VERSION: "0.61.1"
      SWIFTLINT_VERSION: "0.63.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.2 (RC allowed)
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # 当前迁移允许 RC；正式版可通过仓库变量显式切换。
          xcode-version: ${{ vars.CI_XCODE_VERSION || '27.2' }}

      - name: Verify Xcode 27.2
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.2'

      - name: Install tooling
        run: |
          mkdir -p "$RUNNER_TEMP/bin"

          XCODEGEN_TEMP_DIR="$(mktemp -d)"
          curl -fsSL -o "$XCODEGEN_TEMP_DIR/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -qo "$XCODEGEN_TEMP_DIR/xcodegen.zip" -d "$XCODEGEN_TEMP_DIR"
          # 发布压缩包可能增加顶层目录，动态定位可执行文件。
          XCODEGEN_PATH="$(find "$XCODEGEN_TEMP_DIR" -type f -path '*/bin/xcodegen' -print -quit)"
          install -m 0755 "$XCODEGEN_PATH" "$RUNNER_TEMP/bin/xcodegen"
          # XcodeGen 从可执行文件旁的 share 目录读取平台、Debug 和测试预设。
          XCODEGEN_PREFIX="$(dirname "$(dirname "$XCODEGEN_PATH")")"
          mkdir -p "$RUNNER_TEMP/share/xcodegen"
          cp -R "$XCODEGEN_PREFIX/share/xcodegen/SettingPresets" "$RUNNER_TEMP/share/xcodegen/"

          curl -fsSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -qo /tmp/swiftformat.zip -d /tmp/swiftformat
          install -m 0755 /tmp/swiftformat/swiftformat "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          curl -fsSL -o /tmp/SwiftLint.pkg "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"
          sudo installer -pkg /tmp/SwiftLint.pkg -target /

      - name: Show tool versions
        run: |
          xcodegen --version
          swiftformat --version
          swiftlint version

      - name: Verify formatting
        run: ./Scripts/format.sh --check

      - name: Run lint
        run: ./Scripts/lint.sh

      - name: Verify localized copy
        run: python3 ./Scripts/validate_localized_copy.py

  test:
    name: Test (${{ matrix.id }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: iphone
            device: iPhone 18 Pro Max
            runtime: '27.2'
            snapshots: true
          - id: ipad
            device: iPad Pro 13-inch (M5)
            runtime: '27.2'
            snapshots: false
          - id: duo
            device: iPhone Duo
            runtime: '27.1'
            snapshots: false

    env:
      XCODEGEN_VERSION: "2.45.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scripts/requirements.txt

      - name: Install Python script dependencies
        run: python3 -m pip install -r Scripts/requirements.txt

      - name: Select Xcode 27.2 (RC allowed)
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ vars.CI_XCODE_VERSION || '27.2' }}

      - name: Prepare runtime and create task Simulator
        env:
          EXPERIMENT_DEVICE: ${{ matrix.device }}
          EXPERIMENT_RUNTIME: ${{ matrix.runtime }}
          EXPERIMENT_ID: ${{ matrix.id }}
        run: |
          # 持久化在 checkout 外，取消或 runner 异常退出后仍可按归属恢复清理。
          CI_OUTPUT_DIR="$HOME/Library/Logs/ChineseCalendar/ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$EXPERIMENT_ID"
          mkdir -p "$CI_OUTPUT_DIR"
          echo "CHINESE_CALENDAR_CI_OUTPUT_DIR=$CI_OUTPUT_DIR" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$CI_OUTPUT_DIR/commit.txt"
          python3 Scripts/ci_simulator.py prepare-runtime \
            --state "$CI_OUTPUT_DIR/simulator.json" \
            --device "$EXPERIMENT_DEVICE" --runtime "$EXPERIMENT_RUNTIME" \
            2>&1 | tee "$CI_OUTPUT_DIR/runtime-preparation.log"
          SIMULATOR_ID="$(python3 Scripts/ci_simulator.py start \
            --state "$CI_OUTPUT_DIR/simulator.json" \
            --task "$GITHUB_REPOSITORY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$EXPERIMENT_ID" \
            --device "$EXPERIMENT_DEVICE" --runtime "$EXPERIMENT_RUNTIME")"
          echo "CHINESE_CALENDAR_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "SNAPSHOT_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"

          XCODEGEN_TEMP_DIR="$(mktemp -d)"
          curl -fsSL -o "$XCODEGEN_TEMP_DIR/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -qo "$XCODEGEN_TEMP_DIR/xcodegen.zip" -d "$XCODEGEN_TEMP_DIR"
          # 发布压缩包可能增加顶层目录，动态定位可执行文件。
          XCODEGEN_PATH="$(find "$XCODEGEN_TEMP_DIR" -type f -path '*/bin/xcodegen' -print -quit)"
          install -m 0755 "$XCODEGEN_PATH" "$RUNNER_TEMP/bin/xcodegen"
          # XcodeGen 从可执行文件旁的 share 目录读取平台、Debug 和测试预设。
          XCODEGEN_PREFIX="$(dirname "$(dirname "$XCODEGEN_PATH")")"
          mkdir -p "$RUNNER_TEMP/share/xcodegen"
          cp -R "$XCODEGEN_PREFIX/share/xcodegen/SettingPresets" "$RUNNER_TEMP/share/xcodegen/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          ./Scripts/validate_data_schemas.sh
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all ./Scripts/generate_xcodeproj.sh
          ./Scripts/test.sh 2>&1 | tee "$CHINESE_CALENDAR_CI_OUTPUT_DIR/tests.log"

      - name: Compare UI snapshots
        if: matrix.snapshots
        run: ./Scripts/test_snapshots.sh

      - name: Build iOS app
        run: ./Scripts/build_apps.sh 2>&1 | tee "$CHINESE_CALENDAR_CI_OUTPUT_DIR/build.log"

      - name: Save device evidence and delete task Simulator
        if: always() && env.CHINESE_CALENDAR_CI_OUTPUT_DIR != ''
        timeout-minutes: 5
        run: |
          python3 Scripts/ci_simulator.py finish --state "$CHINESE_CALENDAR_CI_OUTPUT_DIR/simulator.json"
          {
            echo "### Simulator evidence"
            echo "Task: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.id }}"
            echo "Archive: $CHINESE_CALENDAR_CI_OUTPUT_DIR"
            if [[ -f "$CHINESE_CALENDAR_CI_OUTPUT_DIR/simulator.json" ]]; then
              cat "$CHINESE_CALENDAR_CI_OUTPUT_DIR/simulator.json"
            else
              echo 'No task Simulator was created; runtime preparation diagnostics were preserved.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and snapshot evidence
        if: always() && env.CHINESE_CALENDAR_CI_OUTPUT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CHINESE_CALENDAR_CI_OUTPUT_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
