name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: xcode-27

    env:
      XCODEGEN_VERSION: "2.45.3"
      SWIFTFORMAT_VERSION: "0.61.1"
      SWIFTLINT_VERSION: "0.63.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '27.1'

      - name: Install tooling
        run: |
          mkdir -p "$RUNNER_TEMP/bin"

          XCODEGEN_TEMP_DIR="$(mktemp -d)"
          curl -fsSL -o "$XCODEGEN_TEMP_DIR/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -qo "$XCODEGEN_TEMP_DIR/xcodegen.zip" -d "$XCODEGEN_TEMP_DIR"
          # The release zip may add a top-level directory, so resolve the binary dynamically.
          XCODEGEN_PATH="$(find "$XCODEGEN_TEMP_DIR" -type f -path '*/bin/xcodegen' -print -quit)"
          install -m 0755 "$XCODEGEN_PATH" "$RUNNER_TEMP/bin/xcodegen"
          # XcodeGen 从可执行文件旁的 share 目录读取平台、Debug 和测试预设。
          XCODEGEN_PREFIX="$(dirname "$(dirname "$XCODEGEN_PATH")")"
          mkdir -p "$RUNNER_TEMP/share/xcodegen"
          cp -R "$XCODEGEN_PREFIX/share/xcodegen/SettingPresets" "$RUNNER_TEMP/share/xcodegen/"

          curl -fsSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -qo /tmp/swiftformat.zip -d /tmp/swiftformat
          install -m 0755 /tmp/swiftformat/swiftformat "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          curl -fsSL -o /tmp/SwiftLint.pkg "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"
          sudo installer -pkg /tmp/SwiftLint.pkg -target /

      - name: Show tool versions
        run: |
          xcodegen --version
          swiftformat --version
          swiftlint version

      - name: Verify formatting
        run: ./Scripts/format.sh --check

      - name: Run lint
        run: ./Scripts/lint.sh

      - name: Verify localized copy
        run: python3 ./Scripts/validate_localized_copy.py

  test:
    name: Test
    runs-on: xcode-27

    env:
      XCODEGEN_VERSION: "2.45.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '27.1'

      - name: Install XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"

          XCODEGEN_TEMP_DIR="$(mktemp -d)"
          curl -fsSL -o "$XCODEGEN_TEMP_DIR/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -qo "$XCODEGEN_TEMP_DIR/xcodegen.zip" -d "$XCODEGEN_TEMP_DIR"
          # The release zip may add a top-level directory, so resolve the binary dynamically.
          XCODEGEN_PATH="$(find "$XCODEGEN_TEMP_DIR" -type f -path '*/bin/xcodegen' -print -quit)"
          install -m 0755 "$XCODEGEN_PATH" "$RUNNER_TEMP/bin/xcodegen"
          # XcodeGen 从可执行文件旁的 share 目录读取平台、Debug 和测试预设。
          XCODEGEN_PREFIX="$(dirname "$(dirname "$XCODEGEN_PATH")")"
          mkdir -p "$RUNNER_TEMP/share/xcodegen"
          cp -R "$XCODEGEN_PREFIX/share/xcodegen/SettingPresets" "$RUNNER_TEMP/share/xcodegen/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          ./Scripts/validate_data_schemas.sh
          ./Scripts/generate_xcodeproj.sh
          ./Scripts/test.sh

      - name: Compare UI snapshots
        run: ./Scripts/test_snapshots.sh

      - name: Upload snapshot failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/snapshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Build iOS app
        run: ./Scripts/build_apps.sh
