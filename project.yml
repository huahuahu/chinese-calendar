name: ChineseCalendar

options:
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  # Work around XcodeGen 2.45.x omitting local package backlinks:
  # https://github.com/yonaskolb/XcodeGen/issues/1549
  postGenCommand: ./Scripts/fix_xcodegen_local_package_backlinks.py

configs:
  Debug: debug
  Release: release

packages:
  ChineseCalendarPackage:
    path: Sources
    group: Packages

targets:
  ChineseCalendar-iOS:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOSApp/Sources
      - path: Apps/Shared/Resources/ChineseCalendarSeedStore.bundle
        buildPhase: resources
      - path: Apps/Shared/Resources/chinese-date-icon.icon
        buildPhase: resources
    dependencies:
      - package: ChineseCalendarPackage
        product: ChineseCalendarLogging
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
      - package: ChineseCalendarPackage
        product: ChineseCalendarPersistence
    preBuildScripts:
      - name: Generate SwiftData Seed Store
        script: |
          set -euo pipefail
          "$SRCROOT/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
        inputFiles:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Package.swift"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Sources/ChineseCalendarSeedStoreBuilder/main.swift"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/manifest.json"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_years.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_months.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_date_expressions.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/dynasties.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_boundaries.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_periods.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_traditions.jsonl"
        outputFiles:
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/ChineseCalendar.sqlite"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/manifest.json"
    settings:
      base:
        PRODUCT_NAME: Chinese Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: chinese-date-icon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F29WG8477A
        CODE_SIGN_ENTITLEMENTS: Apps/iOSApp/ChineseCalendar-iOS.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Apps/iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Chinese Calendar
        CFBundleLocalizations:
          - zh-Hans
        ChineseCalendarFullSeedStoreManifestURL: https://github.com/huahuahu/chinese-calendar/releases/download/full-seed-store-2026.06.28/ChineseCalendarFullSeedStoreManifest.json
        CFBundleURLTypes:
          - CFBundleURLName: com.tiger.suzhou.ChineseCalendar
            CFBundleURLSchemes:
              - chinesecalendar
              - chinese-calendar
        UILaunchScreen: {}

  ChineseCalendar-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/macOSApp/Sources
      - path: Apps/Shared/Resources/ChineseCalendarSeedStore.bundle
        buildPhase: resources
      - path: Apps/Shared/Resources/chinese-date-icon.icon
        buildPhase: resources
    dependencies:
      - package: ChineseCalendarPackage
        product: ChineseCalendarLogging
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
      - package: ChineseCalendarPackage
        product: ChineseCalendarPersistence
    preBuildScripts:
      - name: Generate SwiftData Seed Store
        script: |
          set -euo pipefail
          "$SRCROOT/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
        inputFiles:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Package.swift"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Sources/ChineseCalendarSeedStoreBuilder/main.swift"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/manifest.json"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_years.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_months.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_date_expressions.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/dynasties.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_boundaries.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_periods.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_traditions.jsonl"
        outputFiles:
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/ChineseCalendar.sqlite"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/manifest.json"
    settings:
      base:
        PRODUCT_NAME: Chinese Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: chinese-date-icon
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F29WG8477A
        CODE_SIGN_ENTITLEMENTS: Apps/macOSApp/ChineseCalendar-macOS.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Apps/macOSApp/Info.plist
      properties:
        CFBundleDisplayName: Chinese Calendar
        CFBundleLocalizations:
          - zh-Hans
        ChineseCalendarFullSeedStoreManifestURL: https://github.com/huahuahu/chinese-calendar/releases/download/full-seed-store-2026.06.28/ChineseCalendarFullSeedStoreManifest.json
        LSApplicationCategoryType: public.app-category.reference
        CFBundleURLTypes:
          - CFBundleURLName: com.tiger.suzhou.ChineseCalendar
            CFBundleURLSchemes:
              - chinesecalendar
              - chinese-calendar

schemes:
  ChineseCalendar-iOS:
    build:
      targets:
        ChineseCalendar-iOS: all
    run:
      config: Debug
      language: zh-Hans
      region: CN
      environmentVariables:
        CHINESE_CALENDAR_PERFORMANCE_SIGNPOSTS: "1"

  ChineseCalendar-macOS:
    build:
      targets:
        ChineseCalendar-macOS: all
    run:
      config: Debug
      environmentVariables:
        CHINESE_CALENDAR_PERFORMANCE_SIGNPOSTS: "1"
