name: ChineseCalendar

options:
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  # Work around XcodeGen 2.45.x omitting local package backlinks:
  # https://github.com/yonaskolb/XcodeGen/issues/1549
  postGenCommand: ./Scripts/fix_xcodegen_local_package_backlinks.py

configs:
  Debug: debug
  Release: release

packages:
  ChineseCalendarPackage:
    path: Sources
    group: Packages

targets:
  ChineseCalendar-iOS:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOSApp/Sources
      - path: Apps/Shared/Resources/ChineseCalendarSeedStore.bundle
        buildPhase: resources
      - path: Apps/Shared/Resources/chinese-date-icon.icon
        buildPhase: resources
    dependencies:
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
    preBuildScripts:
      - name: Validate SwiftData Seed Store
        script: |
          set -euo pipefail
          "$SRCROOT/Scripts/BuildChineseCalendarSeedStore/validate_seed_store.sh" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/validate_seed_store.sh"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/seed_store_identity.mjs"
          - "$(SRCROOT)/Sources/ChineseCalendarPersistence/PersistenceSupport.swift"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_years.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_months.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_date_expressions.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/dynasties.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/emperors.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/emperor_reign_segments.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/reign_eras.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_boundaries.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_periods.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/orthodox_traditions.jsonl"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/ChineseCalendar.sqlite"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/manifest.json"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/ChineseCalendarSeedStore.validated"
    settings:
      base:
        PRODUCT_NAME: Chinese Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: chinese-date-icon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # App 与测试共享 UI 产品；传递依赖只导入模块，不再单独静态链接。
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F29WG8477A
        CODE_SIGN_ENTITLEMENTS: Apps/iOSApp/ChineseCalendar-iOS.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Apps/iOSApp/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Chinese Calendar
        CFBundleLocalizations:
          - zh-Hans
        ChineseCalendarFullSeedStoreManifestURL: https://github.com/huahuahu/chinese-calendar/releases/download/full-seed-store-2026.10.04/ChineseCalendarFullSeedStoreManifest.json
        CFBundleURLTypes:
          - CFBundleURLName: com.tiger.suzhou.ChineseCalendar
            CFBundleURLSchemes:
              - chinesecalendar
              - chinese-calendar
        UILaunchScreen: {}

  ChineseCalendarUITests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    deploymentTarget: "26.0"
    sources:
      - path: Sources/ChineseCalendarUI/Tests
      - path: Sources/NavigationCoreTests/NavigationPhysicalHostTests.swift
      - path: Sources/NavigationCoreTests/NavigationPhysicalHostSupport.swift
    dependencies:
      - target: ChineseCalendar-iOS
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendarTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # 共享 UI 产品已包含传递依赖；测试只导入它们，避免再次静态链接。
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        TARGETED_DEVICE_FAMILY: 1,2
        TEST_TARGET_NAME: ChineseCalendar-iOS
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chinese Calendar.app/Chinese Calendar"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ChineseCalendar-iOS:
    build:
      targets:
        ChineseCalendar-iOS: all
        ChineseCalendarUITests: [test]
    test:
      config: Debug
      environmentVariables:
        PACKAGE_RESOURCE_BUNDLE_PATH: "$(BUILT_PRODUCTS_DIR)"
      targets:
        - name: ChineseCalendarUITests
          parallelizable: false
    run:
      config: Debug
      language: zh-Hans
      region: CN
      environmentVariables:
        CHINESE_CALENDAR_PERFORMANCE_SIGNPOSTS: "1"
