name: ChineseCalendar

options:
  createIntermediateGroups: true
  groupSortPosition: top
  # Work around XcodeGen 2.45.x omitting local package backlinks:
  # https://github.com/yonaskolb/XcodeGen/issues/1549
  postGenCommand: ./Scripts/fix_xcodegen_local_package_backlinks.py

configs:
  Debug: debug
  Release: release

packages:
  ChineseCalendarPackage:
    path: Sources
    group: Packages

targets:
  ChineseCalendar-iOS:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget: "26.0"
    sources:
      - path: Apps/iOSApp/Sources
      - path: Apps/Shared/Resources/ChineseCalendarSeedStore.bundle
        buildPhase: resources
    dependencies:
      - package: ChineseCalendarPackage
        product: ChineseCalendarLogging
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
      - package: ChineseCalendarPackage
        product: ChineseCalendarPersistence
    preBuildScripts:
      - name: Generate SwiftData Seed Store
        script: |
          set -euo pipefail
          "$SRCROOT/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
        inputFiles:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Package.swift"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Sources/ChineseCalendarSeedStoreBuilder/main.swift"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/manifest.json"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_years.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_months.jsonl"
        inputFileLists:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/calendar_days_inputs.xcfilelist"
        outputFiles:
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/ChineseCalendar.sqlite"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/manifest.json"
    settings:
      base:
        PRODUCT_NAME: Chinese Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chinese Calendar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Apps/iOSApp/ChineseCalendar-iOS.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1

  ChineseCalendar-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/macOSApp/Sources
      - path: Apps/Shared/Resources/ChineseCalendarSeedStore.bundle
        buildPhase: resources
    dependencies:
      - package: ChineseCalendarPackage
        product: ChineseCalendarLogging
      - package: ChineseCalendarPackage
        product: ChineseCalendarUI
      - package: ChineseCalendarPackage
        product: ChineseCalendarPersistence
    preBuildScripts:
      - name: Generate SwiftData Seed Store
        script: |
          set -euo pipefail
          "$SRCROOT/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
        inputFiles:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/generate_seed_store_if_needed.sh"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Package.swift"
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/Sources/ChineseCalendarSeedStoreBuilder/main.swift"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/manifest.json"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_years.jsonl"
          - "$(SRCROOT)/Data/Processed/swiftdata_import/chinese_lunar_months.jsonl"
        inputFileLists:
          - "$(SRCROOT)/Scripts/BuildChineseCalendarSeedStore/calendar_days_inputs.xcfilelist"
        outputFiles:
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/ChineseCalendar.sqlite"
          - "$(SRCROOT)/Apps/Shared/Resources/ChineseCalendarSeedStore.bundle/manifest.json"
    settings:
      base:
        PRODUCT_NAME: Chinese Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.tiger.suzhou.ChineseCalendar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chinese Calendar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Apps/macOSApp/ChineseCalendar-macOS.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1

schemes:
  ChineseCalendar-iOS:
    build:
      targets:
        ChineseCalendar-iOS: all
    run:
      config: Debug

  ChineseCalendar-macOS:
    build:
      targets:
        ChineseCalendar-macOS: all
    run:
      config: Debug
